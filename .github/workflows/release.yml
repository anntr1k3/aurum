name: Release Aurum

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.0.2)"
        required: true
        default: "v1.0.2"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Verify project invariants
        shell: pwsh
        run: .\tools\Verify-Invariants.ps1

      - name: Restore NuGet Packages
        run: dotnet restore .\Aurum.sln --configfile .\NuGet.Config

      - name: Run Test Suite
        run: dotnet run --project .\tests\Aurum.Core.SelfTests --configuration Release --no-restore

      - name: Publish Single-File Executable
        run: >
          dotnet publish .\src\Aurum.App\Aurum.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output .\publish

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $exePath = ".\publish\Aurum.exe"
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          "$hash  Aurum.exe" | Out-File -Encoding utf8 .\publish\SHA256SUMS.txt
          Write-Host "Aurum.exe SHA-256: $hash"

      - name: Determine Release Tag
        id: vars
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            $tag = "${{ github.event.inputs.tag_name }}"
            if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v1.0.2" }
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and Upload Binary
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Aurum ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            publish/Aurum.exe
            publish/SHA256SUMS.txt
